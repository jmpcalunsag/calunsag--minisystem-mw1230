<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add contact | Personal Contacts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container form-page">
        <a href="index.html">Back to contacts</a>
        <h1>Add contact</h1>
        <p id="message"></p>
        <form class="contact-form" id="contact-form" data-mode="add">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" maxlength="50" required>

            <label for="phone">Phone number</label>
            <input id="phone" name="phone_number" type="tel" required>

            <label for="email">Email address (optional)</label>
            <input id="email" name="email_address" type="email">

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Choose a category</option>
                <option value="friend">Friend</option>
                <option value="family">Family</option>
                <option value="school">School</option>
            </select>

            <button class="button" type="submit">Save contact</button>
        </form>
    </main>
    <script>
        const form = document.getElementById("contact-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            try {
                const response = await fetch("/api/contacts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(Object.fromEntries(new FormData(form)))
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message);
                message.textContent = "Contact added successfully.";
                form.reset();
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
